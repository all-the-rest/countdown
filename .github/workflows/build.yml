name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  e2e:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: Chromium + system deps preinstalled
    # in /ms-playwright (version == @playwright/test in pnpm-lock.yaml). Toolchain
    # (node 26 + pnpm) is still provisioned per-run via pnpm/action-setup +
    # setup-node, exactly as before — the image only supplies the browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify Playwright browsers (fallback install)
        # No-op when the image's browser version matches @playwright/test; only
        # downloads the missing chromium build on version drift (Dependabot bump
        # before the image tag is updated). No --with-deps: apt deps are baked.
        run: npx playwright install chromium
      - run: pnpm build
      - name: Run E2E tests
        id: e2e
        run: pnpm test:e2e
        continue-on-error: true
      - name: Write e2e job summary
        if: always()
        run: node .github/scripts/playwright-summary.mjs
      - name: Fail job on e2e failures
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-and-push:
    needs: [test, e2e]
    # GHCR push/deploy must never run on pull_request events
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
